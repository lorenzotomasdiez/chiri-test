<!DOCTYPE html>

<html class="light" lang="en"><head>

<!-- Google Fonts: Inter for Headline/Body, Public Sans for labels -->

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {

                    "surface-bright": "#fdf8f8",
                    "on-error": "#ffffff",

                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#f4f0ef",
                    "secondary-fixed": "#e5e2e2",
                    "secondary-container": "#e2dfdf",
                    "tertiary-container": "#211c1b",
                    "on-surface-variant": "#46464a",
                    "on-primary-fixed-variant": "#474649",
                    "error": "#ba1a1a",
                    "surface-variant": "#e5e2e1",
                    "on-background": "#1c1b1b",
                    "surface-container-lowest": "#ffffff",
                    "tertiary": "#040302",
                    "on-secondary": "#ffffff",
                    "on-surface": "#1c1b1b",
                    "on-primary-container": "#868587",
                    "secondary": "#5f5e5f",
                    "on-primary-fixed": "#1b1b1d",
                    "surface-tint": "#5f5e60",
                    "on-tertiary-fixed-variant": "#4c4544",
                    "on-secondary-fixed": "#1c1b1c",
                    "on-tertiary-container": "#8c8382",
                    "on-secondary-fixed-variant": "#474647",
                    "surface-dim": "#ddd9d9",
                    "inverse-surface": "#313030",
                    "on-secondary-container": "#646263",
                    "on-tertiary": "#ffffff",
                    "surface-container": "#f1edec",
                    "on-tertiary-fixed": "#1f1a19",
                    "error-container": "#ffdad6",
                    "surface-container-high": "#ebe7e7",
                    "primary-fixed-dim": "#c8c6c8",
                    "surface-container-highest": "#e5e2e1",
                    "primary-container": "#1d1d1f",
                    "outline-variant": "#c7c6ca",
                    "inverse-primary": "#c8c6c8",
                    "primary": "#030304",
                    "primary-fixed": "#e4e2e4",
                    "surface-container-low": "#f7f3f2",
                    "background": "#fdf8f8",
                    "tertiary-fixed-dim": "#cec4c2",
                    "tertiary-fixed": "#ebe0de",
                    "surface": "#fdf8f8"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "display": ["Inter"],
                    "body": ["Inter"],

          },

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
            font-size: 18px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdf8f8; /* Minimal paper color */
        }
        .writing-surface:focus {
            outline: none;
        }
        .placeholder-text {
            color: #46464a;
            opacity: 0.4;
        }
        /* Custom Model Selector Hairline */
        .ui-element {
            border: 1px solid rgba(28, 27, 27, 0.1);
        }
    </style>
</head>
<body class="bg-surface text-on-surface selection:bg-primary-fixed-dim">
<!-- TopNavBar (Shared Component Execution) -->
<header class="fixed top-0 w-full h-12 bg-surface dark:bg-on-background border-b border-outline-variant/30 dark:border-outline/20 flex justify-between items-center px-6 w-full max-w-full z-50">
<!-- Brand Logo -->
<div class="text-lg font-headline font-semibold text-primary dark:text-surface-bright tracking-tight">
            Chiri
        </div>
<!-- Trailing Actions Cluster -->
<div class="flex items-center gap-6 font-body text-sm tracking-tight">
<!-- Predictions Toggle -->
<div class="flex items-center gap-2 cursor-pointer opacity-80 hover:opacity-100 transition-opacity">
<span class="text-on-primary-container font-medium">Predictions</span>
<div class="w-8 h-4 bg-primary rounded-full relative flex items-center px-0.5">
<div class="w-3 h-3 bg-surface rounded-full absolute right-0.5"></div>
</div>
</div>
<!-- Model Selector -->
<div class="flex items-center gap-1.5 cursor-pointer opacity-80 hover:opacity-100 transition-opacity text-on-surface-variant/60 dark:text-on-primary-container/60 hover:text-primary dark:hover:text-surface-bright">
<span>GPT-4o mini</span>
<span class="material-symbols-outlined">expand_more</span>
</div>
<!-- Icons Actions -->
<div class="flex items-center gap-4">
<button class="flex items-center gap-1 cursor-pointer opacity-80 hover:opacity-100 transition-opacity text-on-surface-variant/60 dark:text-on-primary-container/60 hover:text-primary dark:hover:text-surface-bright" title="Copy All">
<span class="material-symbols-outlined" data-icon="copy_all">copy_all</span>
<span class="text-xs">Copy</span>
</button>
<button class="flex items-center gap-1 cursor-pointer opacity-80 hover:opacity-100 transition-opacity text-on-surface-variant/60 dark:text-on-primary-container/60 hover:text-primary dark:hover:text-surface-bright" title="Download">
<span class="material-symbols-outlined" data-icon="download">download</span>
<span class="text-xs">Download .md</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-12 flex flex-col items-center min-h-screen">
<div class="w-full max-w-2xl px-6 lg:px-0">
<!-- Writing Surface -->
<div class="writing-surface w-full min-h-[716px] text-lg leading-relaxed text-on-surface font-body outline-none relative" contenteditable="true" id="editor" spellcheck="false">
<!-- Placeholder text handled via CSS/JS toggle logic for cleaner paper feel -->
<div class="placeholder-text absolute top-0 pointer-events-none select-none" id="placeholder">
                    Start writing. Press Tab to accept a suggestion when you see one.
                </div>
</div>
</div>
</main>
<!-- Invisible Micro-Interaction Logic -->
<script>
        const editor = document.getElementById('editor');
        const placeholder = document.getElementById('placeholder');

        // Toggle placeholder based on content
        editor.addEventListener('input', () => {
            if (editor.innerText.trim().length > 0) {
                placeholder.style.display = 'none';
            } else {
                placeholder.style.display = 'block';
            }
        });

        // Maintain cursor focus on load
        window.onload = () => {
            editor.focus();
        };

        // Command Simulation for "The Blank Sheet that Thinks"
        // Slight ambient fade in for the UI elements
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('header, main');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.8s ease-in-out';
                setTimeout(() => {
                    el.style.opacity = '1';
                }, index * 100);
            });
        });

        // Tab intercept logic placeholder
        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                // Future prediction acceptance logic
                e.preventDefault();
            }
        });
    </script>
</body></html>
